; DLSS 5 experimental (RDNA2 HIP port) v0.4.5 on OptiScaler F5 v0.1.32 (jb132). Log: dlssnr_nr.log next to this file.
[nr]
data_dir=nr_data
; Model resolution: 1280x720 (default, better faces), 960x540 (faster); 1920x1080 or 2560x1440 (most detail, much slower)
; jb132: auto = follow OptiScaler's NR size (WorkingScale / RunBeforeSR): the nearest step up to 1280x720.
model_res=auto
; Model: auto = NVIDIA's new small model when nvngx_dlssnr.dll 310.9.16 carries it, else the old one; large = force the old model
model=auto
; Swin MLP on int8 dot products (faster, same look). 0 = fp16
int8_swin=1
; Post block on int8 dot products (opt-in, slightly faster, tiny image change). 0 = fp16
int8_prepost=0
log=dlssnr_nr.log
sync=1
; Temporal history: stops the frame-to-frame flicker. Needs max_inflight=3 (never 1).
max_inflight=3
history=1
; Edit stabilisation: blends the shown NR edit with the previous one (moved by the game's motion vectors).
; Removes most of the remaining flicker at no cost. 0 = off (the v0.4.2 image), up to 0.95.
edit_temporal=0.3
; Split the network over N frames (2, 3 or 4; 0 = off). v0.4.5: 0 by default. nr_split=3 gives more fps but the
; shown edit may visibly trail in game (a frame or two behind, under investigation).
nr_split=0
nr_split_k=0
; Reuse the network's middle stage on some jobs: faster, no visible difference. 0 = per model (new model every 3rd job,
; old model every 2nd: it flickers more at 3); 1 = off; 2, 3, 4 = every Nth job.
; v0.4.5: vit_every=1 (middle-stage reuse off) by default for the cleanest image; 0 = per model (faster)
vit_every=1
reuse=bottleneck
; When the GPU is still busy with the last frame: wait (up to busy_wait_ms) instead of showing a native frame (stutter fix).
busy_mode=wait
busy_wait_ms=100
; HDR games (white-out fix): auto, on or off
hdr_mode=auto
; HDR auto-exposure: target key, adaptation speed, extra bias; hdr_exposure>0 = fixed exposure instead of auto
hdr_key=0.18
hdr_adapt=0.05
hdr_exposure_bias=1.0
hdr_exposure=0
; OptiScaler "2 passes": strength of the second pass
pass2_gain=0.5
; GPU: NR runs on the GPU the game renders on; 1 = also allow an iGPU (not recommended)
allow_any_gpu=0
; Free the GPU memory of a feature the game stopped using after this many ms
evict_idle_ms=2000
fg_mode=0
gain=1.0
apply=1
gate=1
; NVIDIA look: intensity / style / local_tone / local_structure / skin_structure / auto_mask come from the OptiScaler NR sliders.
; Set a key here (e.g. local_tone=0.5) to override the slider.
; compose: add (default) | nv (NVIDIA's blend, for setups copied from NVIDIA users) | ratio (OkLab, janblade's Transfer 2)
; detail: live-frame detail above the model resolution (1 = as is)
; debug_view (v0.4.5, for bug reports): 0 = normal | 1 = the raw network output (upsampled) | 2 = the NR edit x4 + 0.5 (grey = no change)
debug_view=0
; HDR / colour transfer (v0.4.5, RenoDX "Control-compatible color transfer"): transfer_strength 0 = off (as before) .. 1;
; color_strength 0 = brightness change only .. 1 = the network's colour; paper_white: HDR scene white divisor (HDR games only)
transfer_strength=0
color_strength=1
paper_white=1
; v0.4.5 look: intensity above 1 = linear blend proxy + I*(styled - proxy) (OpenDLSS-NR), clamped; ratio = the old brightness-ratio rule
intensity_rule=linear
; NVIDIA history rules: no colour gate, Catmull-Rom history warp, reflected padding. 1 / bilinear / zero = v0.4.4
history_gate=0
history_filter=catmull
history_pad=reflect
; history_seed: 0 (default) | frame. A per-frame seed (NVIDIA's rule) caused white noise in game, keep 0
history_seed=0
; Debug: dump_frame=N writes frame N's inputs/output next to the log (dump_frames = how many consecutive frames, up to 8); 0 = off
dump_frame=0
dump_frames=1
; Motion vector scale (1 = as the game sends them); the log prints a "motion:" line once
mv_scale=1
