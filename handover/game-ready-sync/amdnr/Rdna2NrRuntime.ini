; Rdna2NrRuntime.dll settings (RDNA2 DLSS-NR port behind AMDNR's lmxxf runtime interface). Log: Rdna2NrRuntime.log next to this file.
[nr]
data_dir=nr_data
; NVIDIA's nvngx_dlssnr.dll (310.8 or 310.9.16) supplies the weights. Empty = look next to this DLL, above nr_data, in the assets folder, next to the game.
weights_dll=
; auto = the new small model (310.9.16 CC_SMALL) when the DLL has it, else the old one; new | old forces one
model=auto
; Network size: auto = the nr_data step nearest in height to the colour AMDNR feeds (x model_scale); or e.g. 960x540
model_res=auto
; Reuse the network's middle stage on some jobs (faster, no visible difference). 0 = per model (new every 3rd, old every 2nd job); 1 = off.
; AMDNR's "Full network" turns it off.
vit_every=0
reuse=bottleneck
; Temporal history (with AMDNR's TEMPORAL flag + motion vectors): 1 = on, 0 = off
history=1
history_gate_lo=0.08
history_gate_hi=0.25
; Colour into the network: auto (HDR transfer once a frame is mostly above 1), ldr (clamp to 0..1), hdr (always the HDR transfer)
encode=auto
hdr_auto_frac=0.125
; Split the network over N jobs (2..8; 0 = off). Off by default: AMDNR's interleave already paces the network. With it on the runtime
; never waits and shows the newest finished edit (not motion-warped yet).
nr_split=0
; GPU wait bound when the host consumes a job that is not finished yet (ms; passthrough after it)
sync_timeout_ms=250
; Run on GPUs other than an RDNA2 dGPU (not supported)
allow_any_gpu=0
int8_swin=-1
log=Rdna2NrRuntime.log
