; High quality: 1280x720 model (handover/iq-guides). Faces and skin follow the full-resolution result much better
; (small face: edit correlation 0.59 -> 0.77 vs the 1440p reference, 1080p model 0.93). About +2.9 ms GPU per frame vs 960x540
; (estimate ~38 fps where 960x540 gives 43). Visible flicker 1.8 % -> 2.7 %.
; Copy the lines below into nr_port.ini (replace the same keys), then restart the game.
[nr]
model_res=1280x720
vit_every=0
max_inflight=3
history=1
nr_split=1
nr_split_k=0
reuse=bottleneck
busy_mode=wait
busy_wait_ms=100
hdr_mode=auto
pass2_gain=0.5
int8_swin=1
